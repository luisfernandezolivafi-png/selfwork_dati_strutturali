<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Dati Strutturali</title>
</head>
<body>

    <script>
        let array_1 = [
            ['un', 'per', 'incatenarli.'],
            ['Anello', 'trovarli,'],
            ['ghermirli', 'e'],
            ['gondor', 'mark'],
        ];

        let array_2 = [
            [['trovarli,']],
            ['tu,', 'sciocchi'],
            ['tu,', 'sciocchi', ['padron', 'Sauron']],
            ['nel', ['fuggite', 'gandalf']],
            [['domarli,', 'passare'], 'buio']
        ];

        let un = array_1[0][0];
        let per = array_1[0][1];
        let incatenarli = array_1[0][2];
        let anello = array_1[1][0];
        let trovarli = array_1[1][1];
        let ghermirli = array_1[2][0];
        let e = array_1[2][1];
        let nel = array_2[3][0];
        let domarli = array_2[4][0][0];
        let buio = array_2[4][1];

        let unMaiuscolo = un.charAt(0).toUpperCase() + un.slice(1);

        console.log(`${unMaiuscolo} ${anello} ${per} ${domarli} ${un} ${anello} ${per} ${trovarli} ${un} ${anello} ${per} ${ghermirli} ${e} ${nel} ${buio} ${incatenarli}`);
    </script>
</body>
</html>
